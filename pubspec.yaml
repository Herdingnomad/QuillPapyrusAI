name: quill_papyrus_ai
description: "Quill & Papyrus AI — On-device Markdown IDE with local AI"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Storage & Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Markdown Editor & Preview
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  highlight: ^0.7.0

  # Media, Audio & Ingestion
  record: ^7.1.2
  audioplayers: ^6.8.1
  image: ^4.12.0

  # Utilities
  uuid: ^4.5.1
  yaml: ^3.1.3
  collection: ^1.19.1
  equatable: ^2.0.7
  file_picker: ^12.1.1
  url_launcher: ^6.3.2
  llama_flutter_android: ^0.2.6
  sqflite_common_ffi: ^2.4.4
  crypto: ^3.0.7
  printing: ^5.15.1
  pdf: ^3.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
        - asset: assets/fonts/JetBrainsMono-Italic-Variable.ttf
          style: italic
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
        - asset: assets/fonts/CourierPrime-Italic.ttf
          style: italic
        - asset: assets/fonts/CourierPrime-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Variable.ttf
        - asset: assets/fonts/Arimo-Italic-Variable.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
        - asset: assets/fonts/Roboto-Italic-Variable.ttf
          style: italic
