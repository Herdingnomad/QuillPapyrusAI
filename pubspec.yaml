name: quill_papyrus_ai
description: "Quill & Papyrus AI — On-device Markdown IDE with local AI"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Storage & Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Markdown Editor & Preview
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  highlight: ^0.7.0

  # Utilities
  uuid: ^4.5.1
  yaml: ^3.1.3
  collection: ^1.19.1
  equatable: ^2.0.7
  file_picker: ^12.1.1
  url_launcher: ^6.3.2
  llama_flutter_android: ^0.2.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
